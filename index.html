<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>ALTERA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Michroma&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* Layout: one phone-width app column. Sticky system bar on top, six-tab dock at the bottom, content stacked as system windows.
   Look: black screen, white system text. Color only arrives as rarity grades and as UI themes the user buys. */
:root{
  color-scheme: dark;
  --black:#000000;
  --ink:#07080c;
  --panel:#0d0f15;
  --panel-2:#141720;
  --line:#232733;
  --line-2:#353a48;
  --text:#eceef3;
  --dim:#8b91a1;
  --faint:#5a6070;
  --accent:#f1f3f8;
  --accent-ink:#07080c;
  --accent-soft:rgba(241,243,248,.07);
  --bar-bg:rgba(7,8,12,.9);
  --good:#7ee2a8; --warn:#ffbf69; --bad:#ff7084; --admin:#ff5d73;
  --r1:#a7adbb; --r2:#7ee2a8; --r3:#74aefc; --r4:#b893ff; --r5:#ffbf69; --r6:#ff6b8a;
  --f-mark:"Michroma","IBM Plex Sans KR",system-ui,sans-serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-sys:"Nanum Gothic Coding","D2Coding",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --col:460px;
}
:root[data-skin="deep"]{--accent:#6fb6ff;--accent-ink:#03111f;--accent-soft:rgba(111,182,255,.1)}
:root[data-skin="crimson"]{--accent:#ff6b7f;--accent-ink:#1c0307;--accent-soft:rgba(255,107,127,.1)}
:root[data-skin="moon"]{--accent:#b79bff;--accent-ink:#120626;--accent-soft:rgba(183,155,255,.1)}
:root[data-skin="gold"]{--accent:#ffc46b;--accent-ink:#1f1302;--accent-soft:rgba(255,196,107,.1)}
:root[data-skin="jade"]{--accent:#5fe0b8;--accent-ink:#021a12;--accent-soft:rgba(95,224,184,.1)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ink)}
body{color:var(--text);font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.035) 1px, transparent 0);background-size:22px 22px;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
b{font-weight:700}

/* top system bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:var(--col);margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{background:none;border:0;padding:4px 0;font-family:var(--f-mark);font-size:15px;letter-spacing:.34em;color:var(--text);display:flex;align-items:center;gap:10px}
.mark .dot{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none}
.mark .dot.on{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chips{display:flex;gap:6px;align-items:center;font-family:var(--f-sys);font-size:12.5px;font-variant-numeric:tabular-nums}
.chip{border:1px solid var(--line-2);border-radius:3px;padding:3px 8px;white-space:nowrap;background:transparent}
.chip.p{border-color:var(--accent);color:var(--accent)}
.chip.adm{border-color:var(--admin);color:var(--admin);font-weight:700}

/* main column */
.view{max-width:var(--col);margin:0 auto;padding-block:16px calc(92px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.view > *{min-width:0}

/* system window */
.win{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:grid;gap:12px;min-width:0}
.win.admin{border-color:rgba(255,93,115,.45)}
.win-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:var(--f-sys);font-size:12px;letter-spacing:.04em;color:var(--dim)}
.win-h .tag{color:var(--accent);font-weight:700}
.win.admin .win-h .tag{color:var(--admin)}
.win-h .r{color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.rule{font-family:var(--f-sys);font-size:12px;line-height:1;color:var(--line-2);white-space:nowrap;overflow:hidden;user-select:none}
.h2{font-size:17px;font-weight:600;letter-spacing:-.01em;text-wrap:balance;margin:0}
.note{font-size:12.5px;color:var(--dim);margin:0;line-height:1.6}
.empty{font-family:var(--f-sys);font-size:12.5px;color:var(--faint);padding:6px 0}
.corner{display:flex;justify-content:flex-end;margin-top:-4px}
.corner .btn{font-family:var(--f-sys);font-size:12px;color:var(--faint);border-color:var(--line);padding:6px 10px}

/* status window */
.status{font-family:var(--f-sys);gap:10px}
.status.flash{animation:flash .9s ease-out}
@keyframes flash{0%{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}100%{border-color:var(--line);box-shadow:none}}
.status-title{font-size:13px;font-weight:700;letter-spacing:.06em}
.kv{display:grid;grid-template-columns:5.2em 1fr;gap:7px 12px;font-size:13.5px;align-items:baseline}
.kv .k{color:var(--dim)}
.kv .v{min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.exp{display:grid;gap:5px}
.exp-track{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.exp-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .5s ease}
.rar{font-weight:700}
.rar-1{color:var(--r1)}.rar-2{color:var(--r2)}.rar-3{color:var(--r3)}.rar-4{color:var(--r4)}.rar-5{color:var(--r5)}.rar-6{color:var(--r6)}

/* console */
.console{display:grid;gap:8px}
.con-lines{font-family:var(--f-sys);font-size:12.5px;display:grid;gap:4px;max-height:168px;overflow-y:auto}
.con-lines .u{color:var(--dim)}
.con-lines .u::before{content:"> ";color:var(--faint)}
.con-lines .s .tag{color:var(--accent);font-weight:700}
.con-form{display:flex;gap:8px}
.input,.select,.textarea{width:100%;min-width:0;background:var(--ink);border:1px solid var(--line-2);border-radius:3px;padding:10px 12px;font-size:14px}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);outline:none}
.textarea{resize:vertical;min-height:72px;line-height:1.5}
.con-form .input{font-family:var(--f-sys)}

/* buttons */
.btn{font-family:var(--f-ui);font-weight:600;font-size:14px;padding:10px 14px;border-radius:3px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--text);white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--dim)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{border-color:rgba(255,93,115,.6);color:var(--admin);background:transparent}
.btn.ghost{background:transparent}
.btn.sm{font-size:12.5px;padding:7px 10px}
.btn.short{color:var(--faint);border-style:dashed}
.btn:disabled{opacity:.4;cursor:default}
.btn.block{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > .input{flex:1 1 120px}

/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line-2);border-radius:3px;overflow:hidden}
.seg button{background:transparent;border:0;padding:10px 8px;font-weight:500;font-size:14px;color:var(--dim)}
.seg button + button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.field{display:grid;gap:6px;min-width:0}
.field label,.lbl{font-family:var(--f-sys);font-size:12px;color:var(--dim)}
.fields{display:grid;gap:10px}

/* quests */
.qlist{display:grid}
.q{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.q:first-child{border-top:0;padding-top:2px}
.q > div{min-width:0}
.q-t{font-weight:600;font-size:14.5px}
.q-d{font-size:12.5px;color:var(--dim);margin-top:2px}
.q-r{font-family:var(--f-sys);font-size:12px;color:var(--accent);margin-top:4px;font-variant-numeric:tabular-nums}
.q.done .q-t{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line-2)}
.q.done .q-r{color:var(--faint)}
.stamp{font-family:var(--f-sys);font-size:11.5px;color:var(--faint);border:1px solid var(--line-2);border-radius:3px;padding:4px 7px;white-space:nowrap}
.prog{font-family:var(--f-sys);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.badge{font-family:var(--f-sys);font-size:11px;border:1px solid var(--line-2);color:var(--dim);border-radius:2px;padding:1px 5px;margin-right:6px;vertical-align:1px}
.main-q{display:grid;gap:10px}
.main-q .q-t{font-size:16px}
.locked{color:var(--faint);font-family:var(--f-sys)}

/* TS */
.ts-pre{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:14px 0 4px}
.ts-node{border:1px solid var(--line-2);border-radius:4px;padding:12px 10px;text-align:center;display:grid;gap:4px;min-width:0}
.ts-node .n{font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ts-node .g{font-family:var(--f-sys);font-size:20px;font-weight:700}
.ts-node.to{border-color:var(--accent);background:var(--accent-soft)}
.ts-arrow{font-family:var(--f-sys);font-size:20px;color:var(--accent)}
.cost{display:flex;justify-content:space-between;font-family:var(--f-sys);font-size:13px;border-top:1px dashed var(--line-2);padding-top:10px}
.cost b{color:var(--accent)}
.rec{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:11px 0;border-top:1px solid var(--line);align-items:center}
.rec:first-child{border-top:0;padding-top:0}
.rec > div{min-width:0}
.rec .m{font-family:var(--f-sys);font-size:12px;color:var(--faint)}
.rec .adj{grid-column:1/-1;font-family:var(--f-sys);font-size:11.5px;color:var(--dim)}
.rec.rev .t{color:var(--faint);text-decoration:line-through}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{background:transparent;border:1px solid var(--line-2);border-radius:20px;padding:5px 11px;font-size:12.5px;color:var(--dim)}
.pills button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* shop */
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;background:transparent;border:1px solid var(--line-2);border-radius:20px;padding:6px 12px;font-size:13px;color:var(--dim)}
.cats button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.cats button.hid{border-style:dashed}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:13px 0;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:0;padding-top:2px}
.item > div{min-width:0}
.item .nm{font-weight:600;font-size:14.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.item .gr{font-family:var(--f-sys);font-size:11px}
.item .ds{font-size:12.5px;color:var(--dim);margin-top:2px}
.item .price{font-family:var(--f-sys);font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:0}

/* bag */
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.slot{border:1px solid var(--line);border-radius:4px;padding:12px;display:grid;gap:6px;align-content:start;min-height:112px;background:var(--panel-2)}
.slot.empty-slot{background:transparent;border-style:dashed;place-items:center;color:var(--faint);font-family:var(--f-sys);font-size:12px;min-height:70px}
.slot .nm{font-weight:600;font-size:14px}
.slot .meta{font-family:var(--f-sys);font-size:11.5px;color:var(--dim)}
.slot .ds{font-size:12px;color:var(--dim)}
.slot .btn{justify-self:start}

/* achievements */
.ach{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ac{border:1px solid var(--line);border-radius:4px;padding:10px 12px;display:grid;gap:3px;align-content:start}
.ac .t{font-weight:600;font-size:13.5px}
.ac .d{font-size:12px;color:var(--dim)}
.ac .tt{font-family:var(--f-sys);font-size:11px;color:var(--accent)}
.ac.off{opacity:.45}
.ac.off .t{color:var(--dim)}

/* log */
.log{display:grid;font-family:var(--f-sys);font-size:12.5px}
.log .l{display:grid;grid-template-columns:4.6em 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.log .l:first-child{border-top:0}
.log .tm{color:var(--faint);font-variant-numeric:tabular-nums}
.log .tx{min-width:0;overflow-wrap:anywhere}
.memo{font-family:var(--f-sys);font-size:12.5px;display:grid;gap:8px;color:var(--dim)}
.memo p{margin:0}
.memo .x{color:var(--text)}

/* NPC */
.npc{display:grid;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.npc:first-child{border-top:0;padding-top:2px}
.npc-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.npc-h .nm{font-weight:600;font-size:15.5px;min-width:0;overflow-wrap:anywhere}
.npc-h .st{font-family:var(--f-sys);font-size:11.5px;color:var(--accent);white-space:nowrap}
.npc .kv{font-size:12.5px;grid-template-columns:3.4em 1fr;gap:4px 10px}
.aff{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-family:var(--f-sys);font-size:11.5px;color:var(--dim)}
.aff-track{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.aff-fill{height:100%;background:var(--accent)}

/* admin */
.peer,.pl{display:grid;gap:6px;padding:11px 0;border-top:1px solid var(--line)}
.peer:first-child,.pl:first-child{border-top:0;padding-top:2px}
.peer{grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.on-dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}
.off-dot{width:7px;height:7px;border-radius:50%;background:var(--line-2);flex:none}
.peer .nm,.pl .nm{font-weight:600;font-size:14px;min-width:0;overflow-wrap:anywhere}
.peer .m,.pl .m{font-family:var(--f-sys);font-size:11.5px;color:var(--dim)}
.pl-h{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:none;border:0;padding:0;text-align:left;width:100%}
.pl-h > div{min-width:0}
.pl-body{display:grid;gap:10px;padding:8px 0 4px}
.pl-log{font-family:var(--f-sys);font-size:11.5px;color:var(--dim);display:grid;gap:3px;max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:3px;padding:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ov{border:1px solid var(--line);border-radius:4px;padding:10px 12px;display:grid;gap:2px}
.ov .n{font-family:var(--f-sys);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.ov .l{font-size:12px;color:var(--dim)}
.tagset{display:flex;flex-wrap:wrap;gap:6px}
.tagset span{border:1px solid var(--line-2);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--dim)}
.chat{display:grid;gap:8px;max-height:56vh;overflow-y:auto;padding:2px 0}
.msg{max-width:86%;padding:9px 12px;border-radius:6px;font-size:14px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.msg .who{display:block;font-family:var(--f-sys);font-size:11px;color:var(--dim);margin-bottom:2px}
.msg.n{justify-self:start;background:var(--panel-2);border:1px solid var(--line-2)}
.msg .rep-b{display:block;margin-top:6px;background:none;border:0;padding:0;color:var(--dim);font-size:11px;text-decoration:underline;cursor:pointer;font-family:var(--f-sys)}
.msg .rep{display:block;margin-top:6px;color:var(--dim);font-size:11px;font-family:var(--f-sys)}
.msg.u{justify-self:end;background:var(--accent-soft);border:1px solid var(--accent)}
.chat-in{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.typing{color:var(--faint);font-family:var(--f-sys)}
.op-meta{font-family:var(--f-sys);font-size:11.5px;color:var(--faint);margin-top:4px}
.chk{display:flex;gap:6px;align-items:center;font-family:var(--f-sys);font-size:12px;color:var(--dim)}
.chk input{accent-color:var(--accent)}
.story-reply{font-family:var(--f-sys);font-size:12.5px;color:var(--dim);border-left:2px solid var(--line-2);padding-left:10px}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(7,8,12,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.dock-in{max-width:var(--col);margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.tab{background:none;border:0;padding:9px 0 10px;display:grid;justify-items:center;gap:1px;color:var(--faint);position:relative;font-size:11.5px}
.tab .gl{font-family:var(--f-sys);font-size:17px;line-height:1.2}
.tab[aria-current="page"]{color:var(--text)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:28%;right:28%;height:2px;background:var(--accent)}
.tab .pip{position:absolute;top:7px;right:calc(50% - 16px);width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* toasts */
.toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:60;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toasts-in{max-width:var(--col);margin:0 auto;display:grid;gap:6px}
.toast{font-family:var(--f-sys);font-size:12.5px;line-height:1.5;background:rgba(13,15,21,.97);border:1px solid var(--line-2);border-radius:3px;padding:9px 12px;box-shadow:0 8px 24px rgba(0,0,0,.45);animation:tin .25s ease-out both}
.toast .tag{color:var(--accent);font-weight:700}
.toast.adm .tag{color:var(--admin)}
.toast .sep{color:var(--faint);font-style:normal}
.toast b{color:var(--accent)}
.toast.out{animation:tout .3s ease-in forwards}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-6px)}}

/* overlays */
.boot{position:fixed;inset:0;z-index:100;background:var(--black);display:flex;align-items:center;justify-content:center;padding-block:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));overflow-y:auto}
.boot-in{width:100%;max-width:400px;display:grid;gap:22px}
.boot-word{font-family:var(--f-mark);font-size:26px;letter-spacing:.42em;color:var(--text)}
.boot-lines{font-family:var(--f-sys);font-size:15px;display:grid;gap:10px;min-height:7.6em}
.boot-lines .cur::after{content:"_";animation:blink 1s steps(1) infinite;color:var(--dim)}
@keyframes blink{50%{opacity:0}}

<script>
/* ALTERA server bridge: on a self-hosted copy (no claude.ai runtime) this maps the app's storage, identity
   and presence calls onto Supabase. Inside a claude.ai artifact it stays dormant. */
(function () {
  if (window.claude || !window.ALTERA_CONFIG || !window.supabase || typeof window.supabase.createClient !== 'function') return;
  var cfg = window.ALTERA_CONFIG;
  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey || /YOUR/i.test(cfg.supabaseUrl + cfg.supabaseAnonKey)) return;
  var sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  window.ALTERA_SB = sb;
  var authReady = null;
  function ensureAuth() {
    if (!authReady) authReady = (async function () {
      var g = await sb.auth.getSession();
      if (g.data && g.data.session) return g.data.session.user;
      var r = await sb.auth.signInAnonymously();
      if (r.error) throw r.error;
      return r.data.user;
    })().catch(function (e) { authReady = null; throw e; });
    return authReady;
  }
  function parentOf(p) { return p.split('/').slice(0, -1).join('/'); }
  function lastSeg(p) { return p.split('/').pop(); }
  function toErr(e) { return { code: e && (e.code === '42501' || /row-level security|permission/i.test(e.message || '')) ? 'invalid_argument' : 'unavailable', message: (e && e.message) || 'error' }; }
  function snapDoc(p, row) { return { id: lastSeg(p), exists: !!row, data: function () { return row ? row.data : undefined; }, metadata: { fromCache: false, hasPendingWrites: false } }; }
  var newId = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); };

  var chan = null, listeners = new Set();
  function hub() {
    if (chan) return;
    chan = sb.channel('altera-docs').on('postgres_changes', { event: '*', schema: 'public', table: 'docs' }, function (payload) {
      var p = (payload.new && payload.new.path) || (payload.old && payload.old.path) || '';
      listeners.forEach(function (l) { l(p); });
    }).subscribe();
  }
  function watch(match, refetch) {
    hub();
    var t = null;
    var l = function (p) { if (!p || match(p)) { clearTimeout(t); t = setTimeout(refetch, 150); } };
    listeners.add(l);
    var poll = setInterval(refetch, 30000);
    return function () { listeners.delete(l); clearInterval(poll); clearTimeout(t); };
  }
  function doc(path) {
    var get = async function () {
      await ensureAuth();
      var r = await sb.from('docs').select('data').eq('path', path).maybeSingle();
      if (r.error) throw toErr(r.error);
      return snapDoc(path, r.data);
    };
    var set = async function (d) {
      await ensureAuth();
      var r = await sb.from('docs').upsert({ path: path, parent: parentOf(path), data: d, updated_at: new Date().toISOString() });
      if (r.error) throw toErr(r.error);
    };
    return {
      id: lastSeg(path), path: path, get: get, set: set,
      update: async function (d) { var s = await get(); if (!s.exists) throw { code: 'invalid_argument', message: 'missing' }; await set(Object.assign({}, s.data(), d)); },
      delete: async function () { await ensureAuth(); var r = await sb.from('docs').delete().eq('path', path); if (r.error) throw toErr(r.error); },
      onSnapshot: function (next, onErr) {
        var dead = false;
        var run = function () { get().then(function (s) { if (!dead) next(s); }).catch(function (e) { if (onErr && !dead) onErr(e); }); };
        run();
        var un = watch(function (p) { return p === path; }, run);
        return function () { dead = true; un(); };
      },
      collection: function (sub) { return coll(path + '/' + sub); }
    };
  }
  function coll(path) {
    var list = async function () {
      await ensureAuth();
      var r = await sb.from('docs').select('path,data').eq('parent', path).limit(1000);
      if (r.error) throw toErr(r.error);
      var docs = (r.data || []).map(function (row) { return snapDoc(row.path, row); });
      return { docs: docs, size: docs.length, empty: !docs.length, docChanges: function () { return []; }, metadata: { fromCache: false, hasPendingWrites: false } };
    };
    return {
      path: path,
      doc: function (id) { return doc(path + '/' + (id || newId())); },
      add: async function (d) { var ref = doc(path + '/' + newId()); await ref.set(d); return ref; },
      get: list,
      onSnapshot: function (next, onErr) {
        var dead = false;
        var run = function () { list().then(function (s) { if (!dead) next(s); }).catch(function (e) { if (onErr && !dead) onErr(e); }); };
        run();
        var un = watch(function (p) { return parentOf(p) === path; }, run);
        return function () { dead = true; un(); };
      }
    };
  }
  var db = { doc: doc, collection: coll };
  var user = {
    id: async function () { try { var u = await ensureAuth(); return u ? u.id : null; } catch (e) { return null; } },
    isOwner: async function () { try { await ensureAuth(); var r = await sb.rpc('is_admin'); return !!r.data; } catch (e) { return false; } },
    canEdit: async function () { return false; },
    can: async function () { return null; }
  };
  var room = null;
  function makeRoom() {
    var handlers = new Set(), peersArr = [], state = {}, ch = null, chReady = null;
    function ready() {
      if (chReady) return chReady;
      chReady = (async function () {
        var u = await ensureAuth();
        var dev = '';
        try { dev = localStorage.getItem('altera_device') || ''; if (!/^[a-z0-9]{6,16}$/.test(dev)) { dev = Math.random().toString(36).slice(2, 10); localStorage.setItem('altera_device', dev); } } catch (e) { dev = Math.random().toString(36).slice(2, 10); }
        var key = u.id + ':' + dev;
        ch = sb.channel('altera-lobby', { config: { presence: { key: key } } });
        ch.on('presence', { event: 'sync' }, function () {
          var st = ch.presenceState(), now = Date.now();
          peersArr = Object.keys(st).map(function (k) {
            var metas = st[k] || [], meta = metas[metas.length - 1] || {};
            var by = k.split(':')[0];
            return { peer: k, by: by, isMe: by === u.id, sameTab: k === key, kind: 'viewer', guest: false, presence: meta.p || {}, updatedAt: meta.t || now };
          });
          handlers.forEach(function (h) { h({ peers: peersArr, joined: [], left: [], updated: [] }); });
        });
        await new Promise(function (res) { ch.subscribe(function (s) { if (s === 'SUBSCRIBED') res(); }); });
      })();
      return chReady;
    }
    return {
      presence: async function (patch) { await ready(); state = Object.assign({}, state, patch); await ch.track({ p: state, t: Date.now() }); },
      onPeers: function (h) { handlers.add(h); ready().catch(function () {}); return function () { handlers.delete(h); }; },
      peers: function () { return peersArr; },
      connected: function () { return !!ch; }
    };
  }
  window.claude = {
    server: true,
    use: async function (name) {
      try { await ensureAuth(); } catch (e) { return null; }
      if (name === 'db') return db;
      if (name === 'user') return user;
      if (name === 'room') { room = room || makeRoom(); return room; }
      return null;
    }
  };
})();

  if (cand.length < 3) SUB_POOL.forEach(q => cand.push({ title: q.t, desc: q.d, diff: q.diff }));
  const have = new Set(S.sub.map(q => q.t));
  cand = cand.filter(c => !have.has(c.title));
  const r = rng(Date.now());
  const chosen = [];
  while (chosen.length < 3 && cand.length) chosen.push(cand.splice(Math.floor(r() * cand.length), 1)[0]);
  S.sub = S.sub.filter(q => !q.done);
  const room = Math.max(0, 5 - S.sub.length);
  const add = chosen.slice(0, room).map((x, i) => { const rw = DIFF_REWARD[x.diff] || DIFF_REWARD['보통']; return { id: 'sub' + Date.now().toString(36) + i, pid: '', t: x.title, d: x.desc, diff: x.diff, p: rw[0], e: rw[1], done: false }; });
  S.sub = S.sub.concat(add);
  sys([themes.length ? '상황 분석 완료' : '퀘스트 생성 완료', themes.length ? '감지된 상황 ' + themes.length + '개' : '일반 퀘스트', '서브 퀘스트 ' + add.length + '개 생성']);
  commit();
}

function applyOpFx(op, target) {
  const fx = op.fx || '';
  const i = fx.indexOf(':');
  const k = i < 0 ? fx : fx.slice(0, i), v = i < 0 ? '' : fx.slice(i + 1);
  const npc = target && target.kind === 'npc' ? S.npcs.find(x => x.id === target.id) : null;
  switch (k) {
    case 'charm': S.charm = true; break;
    case 'boost': S.boost = true; break;
    case 'luckday': S.luckDay = today(); break;
    case 'item': { const it = SHOP_BY[v]; if (it && (S.inv[v] || bagUsed() < S.slots)) { S.inv[v] = (S.inv[v] || 0) + 1; sys(['획득', '▶ ' + it.name]); } else sys(['획득 실패', '인벤토리 슬롯 부족']); break; }
    case 'pr': { const ab = v.split('-').map(Number); grant(ab[0] + Math.floor(Math.random() * ((ab[1] - ab[0]) / 10 + 1)) * 10, 0, ['조작 결과', op.name]); break; }
    case 'fate': if (Math.random() < 0.5) grant(500, 0, ['운명의 갈림길', '성공']); else sys(['운명의 갈림길', '아무 일도 일어나지 않았다']); break;
    case 'e': grant(0, Number(v) * expMult(), ['조작 결과', op.name]); break;
    case 'aff': if (npc) affChange(npc, Number(v)); break;
    case 'affall': S.npcs.forEach(n => affChange(n, Number(v))); break;
    case 'affset': if (npc) affChange(npc, Math.max(0, Number(v) - (npc.aff || 0))); break;
    case 'w': { const j = v.indexOf('='); S.world[v.slice(0, j)] = v.slice(j + 1); break; }
    case 'slot': S.slots += Number(v); break;
    case 'reroll': rerollDaily(); break;
    case 'npcreset': S.npcs.forEach(n => { n.last = ''; }); break;
    case 'weeklyp': {
      const q = S.weekly.list.find(x => !x.done);
      if (!q) { sys(['주간 퀘스트', '진행할 퀘스트가 없습니다']); break; }
      const w = poolGet(WEEKLY_POOL, q.id);
      q.c = Math.min(w.n, q.c + 1);
      if (q.c >= w.n) { q.done = true; S.stats.weekly++; finishQuest(w.t, 'weekly', w); } else sys(['주간 퀘스트 진행', '▶ ' + w.t, q.c + ' / ' + w.n]);
      break;

  }
}
async function runOp(id) {

  if (st.owned || st.today) return;
  if (st.locked) { sys(st.needNpc ? ['조작 불가', 'NPC를 먼저 만드십시오'] : ['잠김', 'Lv.' + op.lv + ' 필요']); return; }
  if (S.points < st.price) { sys(['조작 취소', '포인트 부족', '필요 ' + fmt(st.price) + 'P', '차감 없음']); return; }
  let target = null;

  const tname = target ? target.name : op.tgt === 'w' ? '세계' : (S.name || '사용자');

  const ok = await modal({
    title: op.name,
    html: '<p>' + esc(op.desc) + '</p><p>대상 · ' + esc(tname) + ' | ' + (opIsOnce(op) ? '영구 적용' : opIsDaily(op) ? '하루 1회' : '반복 가능') + '</p><p>비용 · ' + fmt(st.price) + 'P</p>',
    actions: [{ label: '취소', value: false }, { label: '실행', value: true, primary: true }]
  });
  if (!ok || !ok.v || S.points < st.price) return;
  opBusy = true;
  S.points -= st.price; S.stats.spent += st.price;
  if (st.price > 0 && tf('refund') && Math.random() < tf('refund') / 100) { S.points += st.price; S.stats.spent -= st.price; sys(['칭호 능력', '「' + S.title + '」', '조작 비용 환급 +' + fmt(st.price) + 'P']); }
  await runSync(['대상 확인 | ' + tname, c.sync[0], c.sync[1] + ' | ' + op.name, c.sync[2], '현실 동기화 완료']);
  const prevWeather = S.world.weather;
  applyOpFx(op, target);
  if (opIsOnce(op)) S.ops[op.id] = Date.now();

function storyStep() {

  return st;
}

  return st.ok(S);
}

}

function affChange(n, d) {

function itemState(it) {

      if (lv >= max) return { label: max > 1 ? 'MAX' : '보유', owned: true };
      const price = traitPrice(it, lv);
      return { label: fmt(price) + 'P', price, up: lv > 0 };
    }
    case 'perm': if (S.perm[it.id]) return { label: '보유', owned: true }; return { label: fmt(priceOf(it.price)) + 'P', price: priceOf(it.price) };
    case 'bag': if (S.bagExp >= 3) return { label: 'MAX', owned: true }; return { label: fmt(priceOf(it.price)) + 'P', price: priceOf(it.price) };
    case 'item': if (it.max === 1 && S.inv[it.id]) return { label: '보유', owned: true }; return { label: fmt(priceOf(it.price)) + 'P', price: priceOf(it.price) };
    case 'title': if (S.titles.includes(it.title)) return { label: '보유', owned: true }; return { label: fmt(priceOf(it.price)) + 'P', price: priceOf(it.price) };
    case 'skin':
      if (S.skins.includes(it.skin)) return S.skin === it.skin ? { label: '적용 중', owned: true } : { label: '적용', apply: true };
      return { label: fmt(priceOf(it.price)) + 'P', price: priceOf(it.price) };

}

  if (st.owned) return;
  const price = st.price;
  if (S.points < price) { sys(['거래 취소', '포인트 부족', '필요 ' + fmt(price) + 'P', '차감 없음']); return; }

async function sha(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function getSecret() {
  if (dbNS) { try { const s = await dbNS.doc('admin/secret').get(); if (s.exists) return s.data(); return null; } catch (e) {} }
  try { const raw = localStorage.getItem(ADMIN_LOCAL); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
async function setSecret(pw) {
  const salt = Array.from(crypto.getRandomValues(new Uint8Array(12))).map(b => b.toString(16).padStart(2, '0')).join('');
  const h = await sha(salt + ':' + pw);
  const rec = { salt, hash: h, at: Date.now() };
  let saved = false;
  if (dbNS) { try { await dbNS.doc('admin/secret').set(rec); saved = true; } catch (e) {} }
  try { localStorage.setItem(ADMIN_LOCAL, JSON.stringify(rec)); saved = true; } catch (e) {}
  return saved;
}

function modal(opts) {
  return new Promise(resolve => {
    const prev = document.activeElement;
    const wrap = document.createElement('div');
    wrap.className = 'modal';
    wrap.innerHTML = '<div class="modal-box' + (opts.cls ? ' ' + opts.cls : '') + '" role="dialog" aria-modal="true" aria-label="' + esc(opts.title) + '"><div class="win-h"><span class="tag">[' + (opts.tag || 'SYSTEM') + ']</span><span>확인</span></div><h2 class="h2">' + esc(opts.title) + '</h2>' + (opts.html || '') + '<div class="row" style="justify-content:flex-end">' +
      opts.actions.map((a, i) => '<button type="button" class="btn ' + (a.primary ? 'primary' : 'ghost') + '" data-i="' + i + '">' + esc(a.label) + '</button>').join('') + '</div></div>';
    document.body.append(wrap);
    if (opts.mount) opts.mount(wrap);
    const done = (i) => {
      const a = opts.actions[i];
      const data = a && a.value && opts.read ? opts.read(wrap) : null;
      wrap.remove();
      document.removeEventListener('keydown', onKey);
      if (prev && prev.focus) try { prev.focus({ preventScroll: true }); } catch (e) {}
      resolve(a ? { v: a.value, data } : null);
    };
    const onKey = e => { if (e.key === 'Escape') done(-1); };
    document.addEventListener('keydown', onKey);
    wrap.addEventListener('click', e => {
      if (e.target === wrap) return done(-1);
      const b = e.target.closest('button[data-i]');
      if (b) done(Number(b.dataset.i));
    });
    if (!opts.mount) { const pri = wrap.querySelector('.btn.primary'); if (pri) pri.focus(); }
  });
}

function render() {
  const a = document.activeElement;

  let ss = null, se = null;
  if (id) { try { ss = a.selectionStart; se = a.selectionEnd; } catch (e) {} }

}

  else if (t.id === 'sub-situation') subDraft = t.value;
  else if (t.id === 'chat-input') chatDraft = t.value;
  else if (t.id === 'acct-email') acctDraft = t.value;
  else if (t.id.indexOf('npc-') === 0) { const k = t.id.slice(4); if (k in npcDraft) npcDraft[k] = t.value; }
  else if (t.id.indexOf('adm-') === 0) { admDraft[t.id] = t.value; if (t.id === 'adm-search') render(); }
  else if (t.id === 'ts-name') {
    tsDraft.name = t.value;
    const nm = esc(t.value.trim() || '대상');
    const n1 = $('#ts-n1'), n2 = $('#ts-n2');
    if (n1) n1.innerHTML = nm;
    if (n2) n2.innerHTML = nm;
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'title-select') { S.title = e.target.value; sys(['칭호 변경', S.title || '없음', fxText(S.title)]); commit(); }
  else if (e.target.id === 'chat-deep') chatDeep = !!e.target.checked;
});
document.addEventListener('keydown', e => {
  if (e.target && e.target.id === 'chat-input' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendChat(); }
});

/* ---------- boot / tutorial ---------- */
const boot = $('#boot');
let typingSkip = false;
function closeBoot() { boot.hidden = true; }
function skipTyping() { typingSkip = true; }
async function typeLine(container, text) {
  const d = document.createElement('div');
  d.className = 'cur';
  container.append(d);
  if (reduceMotion || typingSkip) { d.textContent = text; d.className = ''; return; }
  for (let i = 1; i <= text.length; i++) {
    if (typingSkip) { d.textContent = text; break; }
    d.textContent = text.slice(0, i);
    await sleep(42);
  }
  d.className = '';
  if (!typingSkip) await sleep(380);
}
async function startBoot() {
  boot.hidden = false;
  typingSkip = false;
  const lines = $('#boot-lines'), step = $('#boot-step'), skip = $('#boot-skip');
  lines.innerHTML = '<div>현실 시스템 연결 완료</div>';
  step.innerHTML = '';
  skip.hidden = false;
  if (!typingSkip && !reduceMotion) await sleep(600);
  for (const t of ['사용자를 확인했습니다.', '환영합니다.', '튜토리얼을 시작합니다.']) await typeLine(lines, t);
  skip.hidden = true;
  if (!boot.hidden) showRegister();
}
function showRegister() {
  const step = $('#boot-step');
  let g = '남성';
  step.innerHTML = '<form class="boot-step" id="reg-form" autocomplete="off"><div class="sysbox"><span><span class="tag">[SYSTEM]</span> 사용자 등록</span>' +
    '<div class="field"><label for="reg-name">이름</label><input class="input" id="reg-name" maxlength="12" value="이하은" required></div>' +
    '<div class="field"><span class="lbl">현재 성별</span><div class="seg" id="reg-g" role="group" aria-label="현재 성별"><button type="button" data-v="남성" aria-pressed="true">남성</button><button type="button" data-v="여성" aria-pressed="false">여성</button></div></div>' +
    '</div><p class="fine">진행 요약(이름, 레벨, 최근 활동)은 이 앱 제작자가 볼 수 있습니다.</p><button class="btn primary block" type="submit">등록</button></form>';
  const seg = $('#reg-g');
  seg.addEventListener('click', e => {
    const b = e.target.closest('button[data-v]'); if (!b) return;
    g = b.dataset.v;
    seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  });
  $('#reg-form').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('#reg-name').value.trim().slice(0, 12) || '이하은';
    S.name = name; S.gender = g;
    showFirstQuest();
  });
}
function showFirstQuest() {
  const step = $('#boot-step');
  step.innerHTML = '<div class="boot-step"><div class="rule" aria-hidden="true">' + RULE + '</div><div class="sysbox"><span><span class="tag">[SYSTEM]</span> 새로운 퀘스트</span><span>▶ ALTERA를 실행하기</span><span>보상 : 100P</span></div><div class="rule" aria-hidden="true">' + RULE + '</div><button class="btn primary block" id="first-run">실행</button></div>';
  $('#first-run').addEventListener('click', () => {
    S.tutorialDone = true;
    S.mainIdx = 1; S.stats.quests++;
    S.mainNotified = 0;
    S.streak = { last: today(), n: 1 };
    ensurePeriods();
    grant(100, 50, ['퀘스트 완료', '▶ ALTERA를 실행하기']);
    commit();
    showTSChoice();
  }, { once: true });
}
function showTSChoice() {
  const step = $('#boot-step');
  step.innerHTML = '<div class="boot-step"><div class="sysbox"><span><span class="tag">[SYSTEM]</span> TS 기능이 활성화되었습니다.</span><span>첫 번째 대상을 선택하세요.</span></div>' +
    '<div class="opts"><button class="opt" data-c="self">□ 자신</button><button class="opt" data-c="other">□ 다른 사람</button></div>' +
    '<p class="aside">...잠깐.<br>...이거, 설마 진짜야..?</p>' +
    '<button class="skip" data-c="later">나중에 선택</button></div>';
  step.querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => {
    const c = b.dataset.c;
    closeBoot();
    if (c === 'later') { go('status'); sys(['튜토리얼 종료', '변환 탭에서 언제든 TS 기능을 쓸 수 있습니다']); return; }
    tsDraft.target = c;
    go('ts');
    if (c === 'other') setTimeout(() => { const n = $('#ts-name'); if (n) n.focus(); }, 60);
  }));
}

/* ---------- start ---------- */
function start(data) {
  const fromHot = data && data.S ? migrate(data.S) : null;
  const local = loadLocal();
  S = fromHot || local || fresh();
  if (data && data.tab && VIEWS[data.tab] && data.tab !== 'admin') tab = data.tab;
  applySkin();
  ensurePeriods();
  if (S.tutorialDone) closeBoot();
  render();
  if (!S.tutorialDone) startBoot();
  initCapabilities().catch(() => {}).then(() => {
    const a = S.tutorialDone && dailyCheckIn();
    const b = S.tutorialDone && checkNight();
    const u = checkUrgent();
    if (a || b || u) commit();
  });
  setInterval(() => {
    const changed = ensurePeriods();
    const c = dailyCheckIn();
    const night = checkNight();
    const urg = checkUrgent();
    if (changed || c || night || urg) commit();
  }, 30000);
}
try { const hot = window.claude && window.claude.hot; if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ S, tab: tab === 'admin' ? 'status' : tab })); } catch (e) {}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') hot.ready(start);
else start((hot && hot.data) || {});
})();
</script>
